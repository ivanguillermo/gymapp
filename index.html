<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Metrics PWA</title>
  <link rel="manifest" href="manifest.json">
  <!-- PapaParse para procesar CSV / Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --primary-green: #2ecc71;
      --accent-pink: #ff477e;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-light: #f5f5f5;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #333;
    }

    h1, h2 {
      text-align: center;
      color: var(--primary-green);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9em;
      color: #aaa;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-pink);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-pink);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #e03e6e;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .metric-card {
      background: #282828;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--primary-green);
    }

    .metric-card.pink {
      border-left-color: var(--accent-pink);
    }

    .metric-title {
      font-size: 0.8em;
      color: #aaa;
    }

    .metric-value {
      font-size: 1.2em;
      font-weight: bold;
      margin-top: 4px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--accent-pink);
      color: var(--accent-pink);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Vista 1: Login -->
    <div id="auth-section">
      <h1>Gym Tracker</h1>
      <form id="login-form">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="email" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="password" required placeholder="******">
        </div>
        <button type="submit">Iniciar Sesión</button>
      </form>
    </div>

    <!-- Vista 2: Dashboard del Usuario -->
    <div id="dashboard-section" style="display:none;">
      <h2 id="user-greeting">¡Hola!</h2>
      
      <div class="form-group">
        <label for="fecha-select">Seleccionar Fecha de Medición:</label>
        <select id="fecha-select"></select>
      </div>

      <!-- Tarjetas de Métricas -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-title">Peso</div>
          <div class="metric-value"><span id="m-peso">-</span> kg</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Cuello</div>
          <div class="metric-value"><span id="m-cuello">-</span> cm</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Brazo Der / Izq</div>
          <div class="metric-value"><span id="m-b-der">-</span> / <span id="m-b-izq">-</span> cm</div>
        </div>
        <div class="metric-card">
          <div class="metric-title">Muslo Der / Izq</div>
          <div class="metric-value"><span id="m-m-der">-</span> / <span id="m-m-izq">-</span> cm</div>
        </div>
        <div class="metric-card pink">
          <div class="metric-title">Grasa Tríceps</div>
          <div class="metric-value"><span id="m-g-tri">-</span> %</div>
        </div>
        <div class="metric-card pink">
          <div class="metric-title">Grasa Abdominal</div>
          <div class="metric-value"><span id="m-g-abd">-</span> %</div>
        </div>
      </div>

      <button id="logout-btn" class="logout-btn">Cerrar Sesión</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDSNvI2PkCVkr-J3yjXy2T8rkbjujj-9AY",
        authDomain: "gymapp-4d679.firebaseapp.com",
        projectId: "gymapp-4d679",
        storageBucket: "gymapp-4d679.firebasestorage.app",
        messagingSenderId: "424474817559",
        appId: "1:424474817559:web:1966b067d1151d5cfe5852",
        measurementId: "G-ZX5Y7N9HMN"  
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIWPk8cl4-Tr6lJylnL-TPvEcWgfIdRW3ktWr6LlOfWO0fDhFcnkwFzkbVl0GBoUzgYFAhJFps6q9D/pub?output=csv';

    let historialUsuario = [];

    // Evento Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        alert("Error de autenticación: " + err.message);
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    // Escuchador de Autenticación
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        cargarDatosDesdeSheets(user.email);
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('dashboard-section').style.display = 'none';
      }
    });

    // Cargar datos del Sheets
    function cargarDatosDesdeSheets(userEmail) {
      Papa.parse(SHEETS_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const data = results.data;
          
          historialUsuario = data.filter(row => row['Correo'] && row['Correo'].trim().toLowerCase() === userEmail.toLowerCase());

          if (historialUsuario.length === 0) {
            alert("No se encontraron mediciones registradas para este correo.");
            return;
          }

          // Ordenar por fecha más reciente (Soporta columna 'Fecha Medicion Peso' o 'Fecha Medicion')
          historialUsuario.sort((a, b) => {
            const fechaA = new Date(a['Fecha Medicion Peso'] || a['Fecha Medicion']);
            const fechaB = new Date(b['Fecha Medicion Peso'] || b['Fecha Medicion']);
            return fechaB - fechaA;
          });

          const primerRegistro = historialUsuario[0];
          document.getElementById('user-greeting').textContent = `¡Hola, ${primerRegistro['Nombres']}!`;

          const selectFecha = document.getElementById('fecha-select');
          selectFecha.innerHTML = '';

          historialUsuario.forEach((medicion, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = medicion['Fecha Medicion Peso'] || medicion['Fecha Medicion'];
            selectFecha.appendChild(opt);
          });

          renderizarMedicion(historialUsuario[0]);
        }
      });
    }

    document.getElementById('fecha-select').addEventListener('change', (e) => {
      const idx = e.target.value;
      renderizarMedicion(historialUsuario[idx]);
    });

    function renderizarMedicion(data) {
      document.getElementById('m-peso').textContent = data['Peso'] || '-';
      document.getElementById('m-cuello').textContent = data['Cuello'] || '-';
      document.getElementById('m-b-der').textContent = data['Brazo Der'] || '-';
      document.getElementById('m-b-izq').textContent = data['Brazo Izq'] || '-';
      document.getElementById('m-m-der').textContent = data['Muslo Der'] || '-';
      document.getElementById('m-m-izq').textContent = data['Muslo Izq'] || '-';
      document.getElementById('m-g-tri').textContent = data['Tricep'] || '-';
      document.getElementById('m-g-abd').textContent = data['Abdominal'] || '-';
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch((err) => console.error('Error al registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
